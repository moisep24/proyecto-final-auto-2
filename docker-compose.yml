services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /proyecto/data/smarthome.db
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    volumes:
      - datos:/proyecto/data
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # bandeja web: http://localhost:8025
      - "1025:1025"   # SMTP

volumes:
  datos:
